[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiyu"
version = "0.1.0"
description = "ZhiYu Phase 1 document ingestion infrastructure"
requires-python = ">=3.10"
dependencies = ["pypdf>=5,<7", "python-docx>=1.2,<2", "beautifulsoup4>=4.12,<5", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
